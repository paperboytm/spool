name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app (arm64 DMG + ZIP)
        run: pnpm run package:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Get version
        id: version
        run: echo "version=$(jq -r .version packages/app/package.json)" >> "$GITHUB_OUTPUT"

      - name: Rename artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          DMG=$(find packages/app/dist -name "*.dmg" ! -name "*.blockmap" | head -1)
          mv "$DMG" "packages/app/dist/Spool-${VERSION}-arm64.dmg"

          ZIP=$(find packages/app/dist -name "*.zip" | head -1)
          mv "$ZIP" "packages/app/dist/Spool-${VERSION}-arm64-mac.zip"

      - name: Upload mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            packages/app/dist/Spool-*.dmg
            packages/app/dist/Spool-*-mac.zip
            packages/app/dist/latest-mac.yml

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app (AppImage + tar.gz)
        run: pnpm run package:linux

      - name: Get version
        id: version
        run: echo "version=$(jq -r .version packages/app/package.json)" >> "$GITHUB_OUTPUT"

      - name: Rename artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          APPIMAGE=$(find packages/app/dist -name "*.AppImage" | head -1)
          mv "$APPIMAGE" "packages/app/dist/Spool-${VERSION}-x86_64.AppImage"

      - name: Upload linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            packages/app/dist/Spool-*.AppImage
            packages/app/dist/latest-linux.yml

  release:
    needs: [build-mac, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: echo "version=$(jq -r .version packages/app/package.json)" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          if [[ -n "$PREV_TAG" ]]; then
            COMMITS=$(git log "$PREV_TAG".."$TAG" --pretty=format:"- %s" --no-merges | grep -v "^- release:")
          else
            COMMITS=$(git log "$TAG" --pretty=format:"- %s" --no-merges -20 | grep -v "^- release:")
          fi
          {
            echo "## What's new"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "## Install"
            echo ""
            echo '**macOS (Apple Silicon)**'
            echo '```bash'
            echo 'curl -fsSL https://spool.pro/install.sh | bash'
            echo '```'
            echo ""
            echo '**Linux (x86_64)**'
            echo 'Download the AppImage from the assets below.'
            echo ""
            echo '> This is an early release — feedback and bug reports welcome via [Issues](https://github.com/spool-lab/spool/issues).'
          } > /tmp/release-notes.md

      - name: Upload to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          ASSETS=$(find artifacts -type f | tr '\n' ' ')
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" $ASSETS \
              --title "Spool ${{ steps.version.outputs.version }}" \
              --notes-file /tmp/release-notes.md
          fi

  publish-npm:
    needs: [build-mac, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Fail fast if the npm token has expired or lost write scope. Granular
      # @spool-lab tokens default to 30-day expiry on npmjs.com — without this
      # check, the workflow would do a full pnpm install + build before
      # discovering the auth is dead, and a re-dispatch costs another full
      # mac + linux build cycle.
      - name: Verify npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm whoami
          rm ~/.npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build dist for every package we publish so the prepack step has a tree
      # to ship. Order matters only for redact → core → cli because the upstream
      # consumer reads dist/index.d.ts at typecheck time during downstream build.
      - name: Build publish targets
        run: |
          pnpm -F @spool-lab/redact build
          pnpm -F @spool-lab/core build
          pnpm -F @spool-lab/cli build

      # Publish in dependency order. Each step is idempotent: if the registry
      # already has this version (re-run after a partial-fail), we skip rather
      # than error. redact is bumped in lockstep with core/cli by release.sh,
      # so a fresh release always produces a new version per package.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          publish_if_missing() {
            local pkg_dir="$1"
            local pkg_name
            local pkg_version
            pkg_name=$(jq -r .name "$pkg_dir/package.json")
            pkg_version=$(jq -r .version "$pkg_dir/package.json")
            if npm view "${pkg_name}@${pkg_version}" version >/dev/null 2>&1; then
              echo "::notice::${pkg_name}@${pkg_version} already on registry — skipping"
            else
              echo "::notice::Publishing ${pkg_name}@${pkg_version}"
              ( cd "$pkg_dir" && pnpm publish --no-git-checks --access public )
            fi
          }
          publish_if_missing packages/redact
          publish_if_missing packages/core
          publish_if_missing packages/cli
