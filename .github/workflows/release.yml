name: Release

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version apps/cli/package.json)"
          expected_tag="v${version}"
          if [ "$GITHUB_REF_TYPE" != 'tag' ] || [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "::error::Release must run from ${expected_tag}, not ${GITHUB_REF_NAME}."
            exit 1
          fi
          if [ "$(git rev-list -n 1 "$expected_tag")" != "$GITHUB_SHA" ]; then
            echo "::error::${expected_tag} does not resolve to the workflow commit."
            exit 1
          fi
          for manifest in \
            package.json \
            packages/redact/package.json \
            packages/session-kit/package.json \
            packages/core/package.json \
            apps/cli/package.json \
            apps/web/package.json; do
            if [ "$(jq -r .version "$manifest")" != "$version" ]; then
              echo "::error::${manifest} is not synchronized at ${version}."
              exit 1
            fi
          done

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Fail fast if the npm token has expired or lost write scope. Granular
      # @spool-lab tokens default to 30-day expiry on npmjs.com.
      - name: Verify npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm whoami
          rm ~/.npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build in dependency order so each downstream package sees the
      # generated declarations from its workspace dependencies.
      - name: Build publish targets
        run: |
          pnpm -F @spool-lab/redact run prepack
          pnpm -F @spool-lab/session-kit run prepack
          pnpm -F @spool-lab/core run prepack
          pnpm -F @spool-lab/cli run prepack

      - name: Verify CLI release
        run: |
          pnpm exec vp check
          pnpm -F @spool-lab/core test
          pnpm -F @spool-lab/cli test

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          publish_if_missing() {
            local pkg_dir="$1"
            local pkg_name
            local pkg_version
            pkg_name=$(jq -r .name "$pkg_dir/package.json")
            pkg_version=$(jq -r .version "$pkg_dir/package.json")
            if npm view "${pkg_name}@${pkg_version}" version >/dev/null 2>&1; then
              echo "::notice::${pkg_name}@${pkg_version} already on registry — skipping"
            else
              echo "::notice::Publishing ${pkg_name}@${pkg_version}"
              ( cd "$pkg_dir" && pnpm publish --no-git-checks --access public )
            fi
          }
          publish_if_missing packages/redact
          publish_if_missing packages/session-kit
          publish_if_missing packages/core
          publish_if_missing apps/cli

  release:
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: echo "version=$(jq -r .version apps/cli/package.json)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          if [[ -n "$PREV_TAG" ]]; then
            COMMITS=$(git log "$PREV_TAG".."$TAG" --pretty=format:"- %s" --no-merges | grep -v "^- release:")
          else
            COMMITS=$(git log "$TAG" --pretty=format:"- %s" --no-merges -20 | grep -v "^- release:")
          fi
          {
            echo "## What's new"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "## Install the CLI"
            echo ""
            echo 'Requires Node.js 22.19 or newer on macOS or Linux.'
            echo '```bash'
            echo 'curl -fsSL https://spool.new/install.sh | sh'
            echo '```'
            echo ""
            echo 'After installation, run `spool` in a project to share its latest Session.'
            echo ""
            echo '> This is an early release — feedback and bug reports welcome via [Issues](https://github.com/spool-lab/spool/issues).'
          } > /tmp/release-notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Spool ${{ steps.version.outputs.version }}" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --title "Spool ${{ steps.version.outputs.version }}" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Deploy the matching production web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_ref="$GITHUB_REF_NAME"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo '::error::origin/main advanced after this release tag; refusing to deploy an older revision.'
            exit 1
          fi
          previous_run_id="$(gh run list \
            --workflow=deploy-web.yml \
            --commit="$GITHUB_SHA" \
            --event=workflow_dispatch \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId' 2>/dev/null || true)"
          gh workflow run deploy-web.yml --ref "$release_ref" -f target=production

          run_id=''
          for _ in $(seq 1 30); do
            candidate="$(gh run list \
              --workflow=deploy-web.yml \
              --commit="$GITHUB_SHA" \
              --event=workflow_dispatch \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId' 2>/dev/null || true)"
            if [ -n "$candidate" ] && [ "$candidate" != "$previous_run_id" ]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done

          if [ -z "$run_id" ]; then
            echo '::error::Could not locate the production deployment run.'
            exit 1
          fi
          gh run watch "$run_id" --exit-status
