name: E2E Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "packages/landing/**"
      - "videos/**"
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "packages/landing/**"
      - "videos/**"
      - "**/*.md"
      - "docs/**"

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        # macOS unit coverage is redundant with Ubuntu — unit tests have no
        # Electron / native-window surface, and macOS e2e still runs on PRs.
        # Skip macOS unit on PRs; keep it on push to main as a safety net.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @spool-lab/redact build
      - run: pnpm --filter @spool-lab/redact test
      - run: pnpm --filter @spool-lab/core build
      - run: pnpm --filter @spool-lab/core test
      - run: pnpm --filter @spool-lab/cli build
      - run: pnpm --filter @spool-lab/cli test
      - run: pnpm --filter @spool/share-kit test
      - run: pnpm --filter @spool/app test

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run E2E tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm --filter @spool/app test:e2e

      - name: Run E2E tests (macOS)
        if: runner.os == 'macOS'
        run: pnpm --filter @spool/app test:e2e

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-${{ matrix.os }}
          path: packages/app/test-results/
          retention-days: 7
