version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      # Keep routine developer-tool churn reviewable while excluding every
      # runtime family that needs its own release or packaged-app validation.
      tooling-patch-minor:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - "@agentclientprotocol/*"
          - "@anthropic-ai/claude-agent-sdk"
          - "@electron/*"
          - "@tailwindcss/*"
          - "@types/better-sqlite3"
          - "@types/react*"
          - "@vitejs/*"
          - "@void/*"
          - "acp-extension-*"
          - "better-sqlite3"
          - "bindings"
          - "electron*"
          - "file-uri-to-path"
          - "i18next"
          - "react*"
          - "rehype-*"
          - "remark*"
          - "shiki"
          - "tailwindcss"
          - "vite"
          - "void"
        update-types:
          - patch
          - minor

      electron-native-patch-minor:
        applies-to: version-updates
        patterns:
          - "@electron/*"
          - "@types/better-sqlite3"
          - "better-sqlite3"
          - "bindings"
          - "electron*"
          - "file-uri-to-path"
        update-types:
          - patch
          - minor

      acp-patch-minor:
        applies-to: version-updates
        patterns:
          - "@agentclientprotocol/*"
          - "@anthropic-ai/claude-agent-sdk"
          - "acp-extension-*"
        update-types:
          - patch
          - minor

      renderer-framework-patch-minor:
        applies-to: version-updates
        patterns:
          - "@tailwindcss/*"
          - "@types/react*"
          - "@vitejs/*"
          - "@void/*"
          - "i18next"
          - "react*"
          - "rehype-*"
          - "remark*"
          - "shiki"
          - "tailwindcss"
          - "vite"
          - "void"
        update-types:
          - patch
          - minor

    # Major updates intentionally match no group. Dependabot will open them
    # separately so Electron, ACP, React/Vite, Shiki, Void, and i18next cannot
    # be hidden inside a bulk upgrade. Security updates also remain separate.
