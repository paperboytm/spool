name = "spool-share-backend"
pages_build_output_dir = "public"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# This is the local-development binding shape. Production and staging use the
# committed wrangler.prod.toml and wrangler.staging.toml files respectively;
# their resource ids are Cloudflare identifiers, not credentials. The
# deploy-pages.mjs helper selects the exact environment config without
# rewriting this file.
#
# Secret values remain external: configure them in Cloudflare and expose only
# the API token/account id to CI through GitHub Actions secrets.
#
# What this file controls:
#   - Binding names that `functions/` reads via `ctx.env.*`
#   - Migrations directory for `wrangler d1 migrations apply`
#   - Bucket names (R2 — resource labels, not secrets)
#
# Local dev: `wrangler pages dev` emulates these bindings under
# `.wrangler/state/`. No Cloudflare account is required.

[[d1_databases]]
binding = "DB"
database_name = "spool-share-db"
migrations_dir = "migrations"
# database_id deliberately omitted; local emulation does not need one.

[[kv_namespaces]]
binding = "SESSIONS"
# id deliberately omitted; local emulation does not need one.

[[kv_namespaces]]
binding = "META"

[[kv_namespaces]]
binding = "RATE"

[[kv_namespaces]]
binding = "NONCE"

[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "spool-snapshots"

[[r2_buckets]]
binding = "OG"
bucket_name = "spool-og"

[[r2_buckets]]
binding = "AVATARS"
bucket_name = "spool-avatars"

[[r2_buckets]]
binding = "HUB"
bucket_name = "spool-hub"

[vars]
ENV = "development"

# Cron cadence for the deletion sweep ("0 */6 * * *"). Pages configs
# reject a [triggers] block outright (wrangler ≥4.9x validates it), so
# this lives here as documentation only — the deletion worker is a
# companion Worker (functions/_scheduled/deletion-worker.ts) sharing the
# same D1/KV/R2 bindings, and its cron is set in
# workers/spool-share-deletion/wrangler.prod.toml.

# Secrets (set ONCE per environment via wrangler — never commit):
#   wrangler pages secret put WORKOS_CLIENT_ID         --project-name spool-share-backend
#       (WorkOS AuthKit environment client id — web sign-in via /api/auth/workos/*;
#        register https://spool.new/api/auth/workos/callback as a redirect URI
#        in the WorkOS dashboard)
#   wrangler pages secret put WORKOS_API_KEY           --project-name spool-share-backend
#       (doubles as the OAuth client_secret and the identities-API Bearer key)
#   wrangler pages secret put WORKOS_WEBHOOK_SECRET    --project-name spool-share-backend
#       (HMAC secret returned by the one-time WorkOS webhook bootstrap)
#   wrangler pages secret put WORKOS_OPERATIONS_TOKEN  --project-name spool-share-backend
#       (shared only with the deletion Worker; protects the outbox drain endpoint)
#   wrangler pages secret put WORKOS_BOOTSTRAP_TOKEN   --project-name spool-share-backend
#       (temporary; remove immediately after POST /api/internal/workos/bootstrap-webhook)
#   wrangler pages secret put ADMIN_USER_IDS           --project-name spool-share-backend
#       (comma-separated user ids allowed to hit /api/admin/*)
#
# CF stores secret values encrypted at rest. Never echoed back through
# wrangler, never available to local dev (use .dev.vars for that —
# also gitignored).
