# Staging Pages deployment config with concrete resource identifiers.
# Resource ids are not credentials; Wrangler authentication remains external.
# Wrangler ≥4.9x refuses config-based Pages deploys without ids, so
# `pnpm run deploy:staging` selects this file through Wrangler's ephemeral
# deploy-config redirect; the checked-in local wrangler.toml is never replaced.
name = "spool-share-backend-staging"
pages_build_output_dir = "public"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "spool-share-db-staging"
database_id = "d5ae7941-5af5-44df-aaaa-7e0846c051c2"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "78b322a332c8451589ace70b53456c1f"

[[kv_namespaces]]
binding = "META"
id = "499ed663056142d0bc1ff7b7af7d3cb5"

[[kv_namespaces]]
binding = "RATE"
id = "4f422eca4a71469792cb9bc228723bb8"

[[kv_namespaces]]
binding = "NONCE"
id = "b8f793fc52084ecea08dff3133dedc79"

[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "spool-snapshots-staging"

[[r2_buckets]]
binding = "OG"
bucket_name = "spool-og-staging"

[[r2_buckets]]
binding = "AVATARS"
bucket_name = "spool-avatars-staging"

[[r2_buckets]]
binding = "HUB"
bucket_name = "spool-hub-staging"

[vars]
ENV = "staging"
PUBLIC_BASE_URL = "https://staging.spool.new"
ABUSE_NOTIFY_EMAIL = "abuse@spool.pro"
