<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" stroke="currentColor" stroke-linecap="round">
  <!-- Spool flange (solid cap, wider than the wound thread) -->
  <ellipse cx="16" cy="7.2" rx="12.2" ry="4.1" fill="currentColor" stroke="none"/>
  <!-- Thread winding diagonally down the barrel -->
  <g fill="none" stroke-width="1.9">
    <path d="M7 12.2 C13 15.8 19.5 15.4 25 14.2"/>
    <path d="M7 16.4 C13 20 19.5 19.6 25 18.4"/>
    <path d="M7 20.6 C13 24.2 19.5 23.8 25 22.6"/>
    <!-- Loose thread end -->
    <path d="M25 22.6 C26.8 24.4 28.4 25.6 30.4 26.2" stroke-width="1.7"/>
  </g>
</svg>
